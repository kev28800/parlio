[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["@libsql/client"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "microphone=(), camera=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
